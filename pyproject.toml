[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "docgen-cli"
version = "1.0.0"
description = "Gerador Automático de Documentação Técnica e Arquitetura para Repositórios de Código Inteiro"
readme = "README.md"
authors = [{ name = "DocGen Team" }]
license = { text = "MIT" }
requires-python = ">=3.9"
keywords = ["documentation", "cli", "markdown", "architecture", "c4-model", "ast", "mermaid"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Topic :: Software Development :: Documentation",
]

[project.scripts]
docgen = "docgen.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["docgen*"]
